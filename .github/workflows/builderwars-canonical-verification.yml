name: One-off BuilderWars live verification
on:
  push:
    branches: [codex/builderwars-live-verify-20261022]
permissions:
  contents: read
concurrency:
  group: builderwars-live-verify-20261022
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_URL: https://builderwars.com
      APP_ROOT: ${{ github.workspace }}/app/live-arena
      RECEIPT_DIR: ${{ github.workspace }}/public-live-evidence
      VERIFIER_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out this isolated verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: verification
          persist-credentials: false
      - name: Check out the exact merged application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1745c0a0cc8aaa31aaf8f67edc7765f32de6b547
          path: app
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: app/live-arena/package-lock.json
      - name: Install exact application dependencies with bounded diagnostics
        timeout-minutes: 3
        working-directory: app/live-arena
        run: |
          test "$(git rev-parse HEAD)" = 1745c0a0cc8aaa31aaf8f67edc7765f32de6b547
          npm ci --ignore-scripts --no-audit --no-fund --loglevel info
      - name: Build the reviewed application without verification-branch files
        timeout-minutes: 3
        working-directory: app/live-arena
        run: npm run build
      - name: Install the application's pinned browser test dependencies
        run: |
          python3 -m venv .live-venv
          .live-venv/bin/python -m pip install -r app/live-arena/tests/requirements-ci.txt
          .live-venv/bin/python -m playwright install --with-deps chromium
      - name: Read actual deployed bytes and exercise provider-free browser journeys
        run: .live-venv/bin/python verification/live-arena/tests/canonical_release_verification.py
      - name: Retain public-only receipt and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: builderwars-live-verification-${{ github.sha }}
          path: public-live-evidence/
          if-no-files-found: error
          retention-days: 7
