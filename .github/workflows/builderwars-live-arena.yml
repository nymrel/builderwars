name: BuilderWars Live Arena
on:
  push:
    branches: [main]
    paths: ['live-arena/**', '.github/workflows/builderwars-live-arena.yml']
  pull_request:
    paths: ['live-arena/**', '.github/workflows/builderwars-live-arena.yml']
permissions:
  contents: read
concurrency:
  group: live-arena-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: live-arena
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: live-arena/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
