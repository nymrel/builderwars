name: BuilderWars live arena

on:
  pull_request:
    paths:
      - "live-arena/**"
      - "arena/games/nim.py"
      - ".github/workflows/live-arena.yml"
  push:
    branches: [main]
    paths:
      - "live-arena/**"
      - "arena/games/nim.py"
      - ".github/workflows/live-arena.yml"

permissions:
  contents: read

concurrency:
  group: live-arena-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked browser-app dependencies
        working-directory: live-arena
        run: npm ci --ignore-scripts
      - name: Typecheck and build
        working-directory: live-arena
        run: npm run build
      - name: Engine, security, Python Nim parity and replay fixtures
        working-directory: live-arena
        run: npm test
      - name: Local bridge authentication and bounds (synthetic backend)
        run: python live-arena/tests/test_bridge.py
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Browser journeys (no provider credentials or model calls)
        working-directory: live-arena
        run: |
          npm run preview -- --port 5178 > /tmp/live-arena-preview.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5178/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser.py
          python tests/nim_browser.py
