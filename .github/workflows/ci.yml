name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builderwars-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    name: Isolation (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Compile engine, CLIs, entrants, and tests
        run: python -m compileall -q arena bin entrants tests

      - name: Run isolation admission and determinism tests
        run: python -m unittest discover -s tests -v

      - name: Run repaired-chain isolation self-check
        run: python bin/isolation_selfcheck.py

  adversarial:
    name: Existing adversarial self-check and verifier parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run the complete adversarial engine self-check
        run: python bin/selfcheck.py

      - name: Regenerate and conformance-check the standalone verifier
        run: python bin/build_verifier.py --check

      - name: Require the committed verifier to match the engine byte-for-byte
        run: git diff --exit-code -- verify.py
