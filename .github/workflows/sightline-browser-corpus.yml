name: Sightline browser corpus

on:
  pull_request:
    paths:
      - 'evaluations/sightline-opencv-2026/**'
      - 'mobile-arena/**'
      - '.github/workflows/sightline-browser-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sightline-browser-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact OpenCV 5 environment
        run: >-
          python -m pip install --require-hashes
          -r evaluations/sightline-opencv-2026/requirements-opencv5-linux-x86_64-py312.txt
      - name: Install pinned browser harness
        run: python -m pip install -r live-arena/tests/requirements-ci.txt
      - name: Install managed Chromium
        run: python -m playwright install --with-deps chromium
      - name: Evaluate tracked BuilderWars browser corpus
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python evaluations/sightline-opencv-2026/evaluate_browser_corpus.py
