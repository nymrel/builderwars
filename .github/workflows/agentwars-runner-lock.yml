name: AgentWars runner lock

on:
  pull_request:
    paths:
      - ".github/workflows/agentwars-runner-lock.yml"
      - "requirements.lock"
      - "requirements.txt"
      - "dependency-lock.json"
      - "bin/**"
      - "games/**"
      - "matches/**"
      - "publishing/agentwars-runner-v1/**"
      - "verify.py"
  push:
    branches:
      - main
    paths:
      # The launch PR adds the runner sources. Registering this workflow alone
      # on main must not claim that those not-yet-merged sources are runnable.
      - "requirements.lock"
      - "requirements.txt"
      - "dependency-lock.json"
      - "bin/**"
      - "games/**"
      - "matches/**"
      - "publishing/agentwars-runner-v1/**"
      - "verify.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentwars-runner-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-lock:
    name: ${{ matrix.platform.label }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-2025
            label: windows-x64
            machine: amd64
          - os: ubuntu-24.04
            label: linux-glibc-x64
            machine: x86_64
          - os: ubuntu-24.04-arm
            label: linux-glibc-arm64
            machine: aarch64
          - os: macos-15
            label: macos-arm64
            machine: arm64
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prove interpreter and runner architecture
        run: >-
          python -c "import platform, sys;
          expected_version=tuple(map(int, '${{ matrix.python-version }}'.split('.')));
          expected_machine='${{ matrix.platform.machine }}';
          actual_machine=platform.machine().lower();
          assert sys.version_info[:2] == expected_version, (sys.version, expected_version);
          assert actual_machine == expected_machine, (actual_machine, expected_machine);
          print({'python': platform.python_version(), 'machine': actual_machine, 'platform': platform.platform()})"

      - name: Install the exact binary-only hash lock
        run: python -m pip install --disable-pip-version-check --no-cache-dir --requirement requirements.lock

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Prove exact distributions and Ed25519 runtime
        run: >-
          python -c "import importlib.metadata as metadata;
          expected={'cryptography':'50.0.1','cffi':'2.1.1','pycparser':'3.0'};
          actual={name:metadata.version(name) for name in expected};
          assert actual == expected, (actual, expected);
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey;
          key=Ed25519PrivateKey.from_private_bytes(bytes(range(1, 33)));
          message=b'agentwars-runner-lock';
          key.public_key().verify(key.sign(message), message);
          print(actual)"

      - name: Check the offline dependency policy
        run: python -B bin/check_agentwars_dependency_lock.py --json

      - name: Smoke-test the customer-local runner CLI
        run: python -B bin/agentwars.py runner --help

      - name: Run adversarial passport checks
        if: matrix.python-version == '3.13'
        run: python -B bin/check_agent_passport.py

      - name: Run adversarial local-runner checks
        if: matrix.python-version == '3.13'
        run: python -B bin/check_agentwars_runner.py

      - name: Rebuild and verify the deterministic runner bundle
        if: matrix.python-version == '3.13'
        run: python -B bin/check_agentwars_runner_bundle.py

      - name: Verify the checked-in candidate bundle
        if: matrix.python-version == '3.13'
        run: python -B publishing/agentwars-runner-v1/verify.py --artifact publishing/agentwars-runner-v1

      - name: Replay a published fixture with the standalone verifier
        if: matrix.python-version == '3.13'
        run: python -B verify.py --json matches/e18c36c2f8903c1f.jsonl
