<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Sightline Architecture — Draft, Not Submitted</title>
  <desc id="description">A bounded visual regression workflow using OpenCV 5, deterministic policy, human approval, digest evidence, and a non-executable AWS preparation boundary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .heading{font:700 32px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .subheading{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .label{font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .detail{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .small{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .core{fill:#eef2ff;stroke:#818cf8}
      .control{fill:#ecfdf5;stroke:#34d399}
      .evidence{fill:#f0f9ff;stroke:#38bdf8}
      .held{fill:#fff7ed;stroke:#fb923c}
      .line{fill:none;stroke:#475569;stroke-width:2.25;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#94a3b8;stroke-width:1.75;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>
  <text class="heading" x="64" y="62">Sightline · bounded visual decisions</text>
  <text class="subheading" x="64" y="91">OpenCV 5 perception → deterministic policy → human-controlled outcome</text>
  <g transform="translate(1034 42)">
    <rect width="182" height="38" rx="19" fill="#fee2e2" stroke="#fca5a5"/>
    <text class="small" x="91" y="24" text-anchor="middle" fill="#991b1b">DRAFT · NOT SUBMITTED</text>
  </g>

  <g>
    <rect class="card" x="64" y="150" width="208" height="94"/>
    <text class="label" x="88" y="183">Bounded PNG pair</text>
    <text class="detail" x="88" y="208">Baseline + candidate</text>
    <text class="detail" x="88" y="228">equal dimensions · local only</text>

    <rect class="card core" x="336" y="150" width="208" height="94"/>
    <text class="label" x="360" y="183">OpenCV 5 perception</text>
    <text class="detail" x="360" y="208">decode · absdiff · threshold</text>
    <text class="detail" x="360" y="228">connected components</text>

    <rect class="card core" x="608" y="150" width="208" height="94"/>
    <text class="label" x="632" y="183">Typed findings</text>
    <text class="detail" x="632" y="208">kind · risk · bounding box</text>
    <text class="detail" x="632" y="228">changed pixels · image pixels</text>

    <rect class="card control" x="880" y="150" width="272" height="94"/>
    <text class="label" x="904" y="183">Deterministic policy</text>
    <text class="detail" x="904" y="208">accept · request approval</text>
    <text class="detail" x="904" y="228">or reject unbounded input</text>

    <path class="line" d="M272 197 H326"/>
    <path class="line" d="M544 197 H598"/>
    <path class="line" d="M816 197 H870"/>
  </g>

  <g>
    <rect class="card evidence" x="336" y="318" width="208" height="94"/>
    <text class="label" x="360" y="351">SHA-256 evidence</text>
    <text class="detail" x="360" y="376">normalized findings digest</text>
    <text class="detail" x="360" y="396">source + viewport bound</text>

    <rect class="card control" x="608" y="318" width="208" height="94"/>
    <text class="label" x="632" y="351">Human control</text>
    <text class="detail" x="632" y="376">material changes stop</text>
    <text class="detail" x="632" y="396">no mutation authority</text>

    <rect class="card held" x="880" y="318" width="272" height="94"/>
    <text class="label" x="904" y="351">Execution held</text>
    <text class="detail" x="904" y="376">AWS invoked = false</text>
    <text class="detail" x="904" y="396">execution authorized = false</text>

    <path class="dash" d="M712 244 V308"/>
    <path class="line" d="M544 365 H598"/>
    <path class="line" d="M816 365 H870"/>
  </g>

  <g>
    <rect x="64" y="486" width="1088" height="136" rx="18" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
    <text class="label" x="88" y="520">AWS-compatible preparation boundary</text>
    <text class="detail" x="88" y="544">This lane demonstrates packaging compatibility only. It is not cloud execution evidence.</text>

    <rect x="88" y="565" width="232" height="38" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="small" x="204" y="589" text-anchor="middle">Lambda-compatible handler</text>
    <rect x="362" y="565" width="232" height="38" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="small" x="478" y="589" text-anchor="middle">Deterministic source ZIP</text>
    <rect x="636" y="565" width="232" height="38" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="small" x="752" y="589" text-anchor="middle">Inert prepare-only plan</text>
    <rect x="910" y="565" width="218" height="38" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text class="small" x="1019" y="589" text-anchor="middle" fill="#991b1b">No credentials · no deploy</text>

    <path class="line" d="M320 584 H352"/>
    <path class="line" d="M594 584 H626"/>
    <path class="line" d="M868 584 H900"/>
  </g>

  <text class="small" x="64" y="676">Private draft asset · generated from tracked Nymrel-owned source · no external fonts, scripts, images, or network references</text>
</svg>
