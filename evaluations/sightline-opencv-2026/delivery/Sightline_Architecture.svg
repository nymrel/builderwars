<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Sightline architecture - local verified loop and pending AWS runtime</title><rect width="1600" height="900" fill="#0b1222"/><g font-family="sans-serif" fill="#e7f1f8"><text x="66" y="68" font-size="22" fill="#75d8cc">NYMREL / BUILDERWARS</text><text x="66" y="120" font-size="42" font-weight="bold">Sightline: visual evidence changes the next decision.</text><text x="66" y="165" font-size="23" fill="#b5c7d8">Verified local journey | Scripted demo approval | AWS execution pending</text></g><rect x="66" y="220" width="468" height="155" rx="14" fill="#142338" stroke="#344e66"/><g font-family="sans-serif"><text x="89" y="260" fill="#75d8cc" font-size="27" font-weight="bold">1. Capture</text><text x="89" y="303" fill="#e7f1f8" font-size="22">Baseline + candidate PNG</text><text x="89" y="341" fill="#b5c7d8" font-size="20">Tracked BuilderWars interface</text></g><rect x="566" y="220" width="468" height="155" rx="14" fill="#142338" stroke="#344e66"/><g font-family="sans-serif"><text x="589" y="260" fill="#75d8cc" font-size="27" font-weight="bold">2. Perceive</text><text x="589" y="303" fill="#e7f1f8" font-size="22">OpenCV 5.0.0</text><text x="589" y="341" fill="#b5c7d8" font-size="20">Threshold + connected components</text></g><rect x="1066" y="220" width="468" height="155" rx="14" fill="#142338" stroke="#344e66"/><g font-family="sans-serif"><text x="1089" y="260" fill="#75d8cc" font-size="27" font-weight="bold">3. Decide</text><text x="1089" y="303" fill="#e7f1f8" font-size="22">Typed findings + SHA-256</text><text x="1089" y="341" fill="#b5c7d8" font-size="20">Accept / request approval / reject</text></g><rect x="1066" y="430" width="468" height="155" rx="14" fill="#142338" stroke="#344e66"/><g font-family="sans-serif"><text x="1089" y="470" fill="#75d8cc" font-size="27" font-weight="bold">4. Enforce scope</text><text x="1089" y="513" fill="#e7f1f8" font-size="22">Unapproved restore rejected</text><text x="1089" y="551" fill="#b5c7d8" font-size="20">One-use, candidate-bound demo event</text></g><rect x="566" y="430" width="468" height="155" rx="14" fill="#142338" stroke="#344e66"/><g font-family="sans-serif"><text x="589" y="470" fill="#75d8cc" font-size="27" font-weight="bold">5. Restore fixture</text><text x="589" y="513" fill="#e7f1f8" font-size="22">Separate temporary DOM controller</text><text x="589" y="551" fill="#b5c7d8" font-size="20">Planner has no product-write tool</text></g><rect x="66" y="430" width="468" height="155" rx="14" fill="#142338" stroke="#344e66"/><g font-family="sans-serif"><text x="89" y="470" fill="#75d8cc" font-size="27" font-weight="bold">6. Verify fresh image</text><text x="89" y="513" fill="#e7f1f8" font-size="22">New screenshot + OpenCV pass</text><text x="89" y="551" fill="#b5c7d8" font-size="20">Zero findings; baseline-identical bytes</text></g><polyline points="534,297 560,297" stroke="#75d8cc" stroke-width="5" fill="none"/><polyline points="1034,297 1060,297" stroke="#75d8cc" stroke-width="5" fill="none"/><polyline points="1300,375 1300,423" stroke="#75d8cc" stroke-width="5" fill="none"/><polyline points="1066,507 1040,507" stroke="#75d8cc" stroke-width="5" fill="none"/><polyline points="566,507 540,507" stroke="#75d8cc" stroke-width="5" fill="none"/><rect x="66" y="640" width="1468" height="180" rx="14" fill="#241e18" stroke="#c98a40" stroke-dasharray="9 7"/><g font-family="sans-serif"><text x="90" y="681" fill="#ffc978" font-size="27" font-weight="bold">AWS RUNTIME: PROPOSED, NOT EXECUTED</text><text x="90" y="727" fill="#e7f1f8" font-size="23">Bounded handler + exact dependencies -&gt; authorized AWS host -&gt; real findings + runtime receipt</text><text x="90" y="768" fill="#b5c7d8" font-size="22">Account, cost envelope, invocation evidence and judge endpoint / arranged screen share remain unverified.</text><text x="66" y="862" fill="#b5c7d8" font-size="20">Human approval was not observed. One known fixture is verified; production accuracy and general remediation are unmeasured.</text></g></svg>